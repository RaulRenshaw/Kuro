<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=reservas.html">
  <title>KURO / SHIRO — Painel de Reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F1;
      --ink:#111011;
      --red:#9E1B1B;
      --stone:#8C8579;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:'Inter',sans-serif;
      display:grid;
      place-items:center;
    }
    .card{
      width:min(560px, calc(100vw - 32px));
      background:#fff;
      border:1px solid rgba(17,16,17,0.10);
      border-radius:10px;
      padding:28px;
      box-shadow:0 8px 30px rgba(17,16,17,0.08);
    }
    .logo{
      width:108px;
      height:auto;
      background:#fff;
      border-radius:8px;
      padding:10px;
      display:block;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-family:'Shippori Mincho',serif;
      font-size:28px;
      font-weight:600;
      letter-spacing:0.02em;
    }
    p{margin:10px 0 0;color:var(--stone);line-height:1.5}
    a{color:var(--red);text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="kuro-logo.png" alt="Logo Kuro">
    <h1>KURO / SHIRO</h1>
    <p>Redirecionando para o painel de reservas.</p>
    <p>Se não abrir automaticamente, acesse <a href="reservas.html">reservas.html</a>.</p>
  </div>
</body>
</html>
